[project]
name = "basic_crewai"
version = "0.1.0"
description = "basic_crewai using crewAI"
authors = [{ name = "Your Name", email = "you@example.com" }]
requires-python = ">=3.10,<3.14"
dependencies = [
    "crewai[litellm,tools]>=1.15.16,<2.0.0",
    "litellm>=1.97.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/basic_crewai"]

[tool.hatch.build.targets.sdist]
include = ["src/basic_crewai", "agents", "crew.jsonc", "tools", "knowledge", "skills"]

[tool.crewai]
type = "crew"
definition = "crew.jsonc"
project_id = "f7ebc86c-c5e4-4032-89d9-ca642c949a4d"
